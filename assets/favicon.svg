<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Attesta">
  <defs>
    <linearGradient id="attesta-fav" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F8CFF"/>
      <stop offset="50%"  stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded tile (matches the app's pure-black identity) so the mark reads at 16px. -->
  <rect width="64" height="64" rx="14" fill="#0A0B14"/>
  <!-- Three voice bars, bolder + centered for small-size legibility. -->
  <rect x="14"   y="24" width="8" height="16" rx="4" fill="url(#attesta-fav)"/>
  <rect x="28"   y="12" width="8" height="40" rx="4" fill="url(#attesta-fav)"/>
  <rect x="42"   y="27" width="8" height="10" rx="4" fill="url(#attesta-fav)"/>
</svg>
